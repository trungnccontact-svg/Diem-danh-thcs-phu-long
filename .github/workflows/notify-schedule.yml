name: Scheduled Attendance Notifications

on:
  schedule:
    # Giờ Việt Nam (UTC+7): 07:00, 10:30, 13:15, 16:50 mỗi ngày.
    - cron: '0 0 * * *'
    - cron: '30 3 * * *'
    - cron: '15 6 * * *'
    - cron: '50 9 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Loại thông báo (morning-start | morning-end | afternoon-start | afternoon-end | custom)'
        required: true
        default: 'morning-start'
      is_test:
        description: 'Chế độ test (true: thêm prefix [TEST], false: sản xuất)'
        required: false
        default: 'false'
      validate_only:
        description: 'Chỉ kiểm tra workflow và cấu hình, không gửi thông báo'
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-attendance-reminder]

jobs:
  send_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Cài đặt thư viện Firebase
        run: npm ci --prefix scripts --ignore-scripts

      - name: Xác định loại thông báo dựa vào giờ chạy (Cron / Dispatch)
        id: set_type
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TYPE=${{ github.event.inputs.type }}" >> $GITHUB_ENV
            echo "IS_TEST=${{ github.event.inputs.is_test }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            PAYLOAD_TYPE="${{ github.event.client_payload.type }}"
            PAYLOAD_TEST="${{ github.event.client_payload.is_test }}"
            echo "TYPE=${PAYLOAD_TYPE:-morning-start}" >> $GITHUB_ENV
            echo "IS_TEST=${PAYLOAD_TEST:-false}" >> $GITHUB_ENV
          else
            echo "IS_TEST=false" >> $GITHUB_ENV
            CRON="${{ github.event.schedule }}"
            if [ "$CRON" == "0 0 * * *" ]; then
              echo "TYPE=morning-start" >> $GITHUB_ENV
            elif [ "$CRON" == "30 3 * * *" ]; then
              echo "TYPE=morning-end" >> $GITHUB_ENV
            elif [ "$CRON" == "15 6 * * *" ]; then
              echo "TYPE=afternoon-start" >> $GITHUB_ENV
            elif [ "$CRON" == "50 9 * * *" ]; then
              echo "TYPE=afternoon-end" >> $GITHUB_ENV
            else
              echo "TYPE=custom" >> $GITHUB_ENV
            fi
          fi

      - name: Tạo file Service Account JSON từ Github Secrets
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync('service-account.json', process.env.FIREBASE_KEY);"


      - name: Gửi thông báo
        if: ${{ inputs.validate_only != true }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          IS_TEST_RUN: ${{ env.IS_TEST || 'false' }}
        run: |
          node scripts/test-notification.mjs --all --type $TYPE

      - name: Kiểm tra cấu hình không gửi thông báo
        if: ${{ inputs.validate_only == true }}
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          node --check scripts/test-notification.mjs
          node --input-type=module -e "import fs from 'node:fs'; const key=JSON.parse(fs.readFileSync('service-account.json','utf8')); if (!key.project_id || !key.client_email || !key.private_key || !process.env.FIREBASE_DATABASE_URL) throw new Error('Thiếu cấu hình Firebase trong GitHub Secrets'); console.log('Cấu hình Firebase hợp lệ về cấu trúc');"

      - name: Xóa file Service Account sau khi chạy xong
        if: always()
        run: rm -f service-account.json
